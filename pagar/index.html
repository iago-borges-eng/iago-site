<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<title>Gerar link de pagamento | Iago Bald</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/site.css" />
</head>
<body>
<div class="grain"></div><div class="glow"></div>
<header id="hdr">
  <nav class="wrap">
    <a href="/" class="brand"><span class="bars"><i></i><i></i><i></i></span>Iago&nbsp;Bald</a>
    <div class="nav-links" id="navLinks">
      <a class="navlink" href="/consultoria">Consultoria</a>
      <a class="navlink" href="/mentoria">Mentoria</a>
      <a class="navlink" href="/recursos">Recursos</a>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/></svg>
    </button>
  </nav>
</header>

<main>
  <section class="wrap" style="padding-top:128px;padding-bottom:72px">
    <article style="max-width:560px;margin:0 auto">
      <div class="eyebrow">Ferramenta interna</div>
      <h1 class="title" style="font-size:2rem;margin-bottom:8px">Gerar link de pagamento</h1>
      <p class="lead" style="margin-bottom:28px">Preencha o valor, clique e copie o link do Mercado Pago pra mandar pro cliente no WhatsApp.</p>

      <div class="p-presets">
        <button type="button" class="p-chip" data-desc="Mentoria O Dono Livre · turma fundadora" data-valor="291" data-parc="3">Mentoria · 3x R$97</button>
        <button type="button" class="p-chip" data-desc="Consultoria Bald" data-valor="" data-parc="12">Consultoria (valor livre)</button>
      </div>

      <form id="payForm" class="p-form" autocomplete="off">
        <label>Descrição
          <input type="text" name="descricao" placeholder="Ex.: Consultoria Bald — projeto João" maxlength="200" required />
        </label>
        <div class="p-row">
          <label>Valor (R$)
            <input type="number" name="valor" placeholder="0,00" min="5" max="100000" step="0.01" inputmode="decimal" required />
          </label>
          <label>Parcelas (máx)
            <select name="parcelas">
              <option value="1">1x à vista</option>
              <option value="2">2x</option>
              <option value="3">3x</option>
              <option value="6">6x</option>
              <option value="10">10x</option>
              <option value="12" selected>12x</option>
            </select>
          </label>
        </div>
        <label>Nome do cliente <span class="p-opt">(opcional)</span>
          <input type="text" name="nome" placeholder="Pra identificar o pagamento" maxlength="80" />
        </label>
        <label>WhatsApp do cliente <span class="p-opt">(opcional, só dígitos)</span>
          <input type="tel" name="whats" placeholder="Ex.: 71999998888" inputmode="numeric" />
        </label>
        <button type="submit" id="genBtn" class="btn btn-primary" style="width:100%;justify-content:center;padding:15px">Gerar link →</button>
        <p id="payErr" class="p-err"></p>
      </form>

      <div id="payOk" class="p-ok">
        <div class="p-ok-label">Link gerado</div>
        <a id="payLink" class="p-link" href="#" target="_blank" rel="noopener"></a>
        <div class="p-actions">
          <button type="button" id="copyBtn" class="btn btn-primary" style="justify-content:center">Copiar link</button>
          <a id="waBtn" class="btn btn-ghost" href="#" target="_blank" rel="noopener">Enviar no WhatsApp</a>
        </div>
        <button type="button" id="newBtn" class="p-new">← Gerar outro</button>
      </div>
    </article>
  </section>
</main>

<footer>
  <div class="foot">
    <span>© <span id="yr">2026</span> Iago Bald</span>
    <span><a href="/consultoria">Consultoria</a> · <a href="/mentoria">Mentoria</a></span>
  </div>
</footer>

<style>
  .p-presets{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
  .p-chip{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);background:var(--card-bg);border:1px solid var(--line);border-radius:100px;padding:8px 14px;cursor:pointer;transition:border-color .2s,color .2s}
  .p-chip:hover{border-color:var(--orange);color:var(--bege)}
  .p-form{display:flex;flex-direction:column;gap:16px}
  .p-form label{display:flex;flex-direction:column;gap:7px;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .p-opt{text-transform:none;letter-spacing:0;color:var(--dim)}
  .p-form input,.p-form select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--bege);font-family:'Lato';font-size:16px;padding:13px 15px;outline:none;transition:border-color .2s}
  .p-form input:focus,.p-form select:focus{border-color:var(--orange)}
  .p-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .p-err{color:#e5484d;font-size:14px;margin:0;min-height:1px}
  .p-ok{display:none;margin-top:8px;background:var(--card-bg);border:1px solid var(--line);border-radius:16px;padding:26px}
  .p-ok.show{display:block}
  .p-ok-label{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin-bottom:12px}
  .p-link{display:block;word-break:break-all;font-family:'Space Mono',monospace;font-size:13px;color:var(--bege);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:13px 15px;margin-bottom:16px}
  .p-actions{display:flex;gap:12px;flex-wrap:wrap}
  .p-actions .btn{flex:1;min-width:150px}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--bege)}
  .btn-ghost:hover{border-color:var(--orange);transform:translateY(-2px)}
  .p-new{display:block;margin:18px auto 0;background:none;border:none;color:var(--muted);font-family:'Space Mono',monospace;font-size:12px;cursor:pointer}
  .p-new:hover{color:var(--orange)}
  @media(max-width:560px){.p-row{grid-template-columns:1fr}}
</style>
<script src="/assets/site.js"></script>
<script>
(function(){
  var form=document.getElementById('payForm'), btn=document.getElementById('genBtn');
  var err=document.getElementById('payErr'), ok=document.getElementById('payOk');
  var link=document.getElementById('payLink'), waBtn=document.getElementById('waBtn');
  var copyBtn=document.getElementById('copyBtn'), newBtn=document.getElementById('newBtn');

  document.querySelectorAll('.p-chip').forEach(function(c){
    c.addEventListener('click',function(){
      form.descricao.value=c.dataset.desc||'';
      form.valor.value=c.dataset.valor||'';
      form.parcelas.value=c.dataset.parc||'12';
      (c.dataset.valor?form.valor:form.valor).focus();
    });
  });

  form.addEventListener('submit',function(e){
    e.preventDefault();
    err.textContent='';
    var body={
      descricao:form.descricao.value.trim(),
      valor:parseFloat(form.valor.value),
      parcelas:parseInt(form.parcelas.value,10),
      nome:form.nome.value.trim()||undefined
    };
    btn.disabled=true; btn.textContent='Gerando…';
    fetch('/api/criar-checkout',{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)
    }).then(function(r){return r.json().then(function(j){return {okr:r.ok,j:j};});})
      .then(function(res){
        btn.disabled=false; btn.textContent='Gerar link →';
        if(!res.okr){ err.textContent=res.j.error||'Não consegui gerar o link.'; return; }
        var url=res.j.init_point||res.j.sandbox_init_point;
        link.textContent=url; link.href=url;
        var whats=form.whats.value.replace(/\D/g,'');
        var msg='Oi! Segue o link pra pagamento: '+url;
        waBtn.href=(whats?('https://wa.me/55'+whats+'?text='):'https://wa.me/?text=')+encodeURIComponent(msg);
        form.style.display='none'; ok.classList.add('show');
        window.scrollTo({top:0,behavior:'smooth'});
      }).catch(function(){
        btn.disabled=false; btn.textContent='Gerar link →';
        err.textContent='Ops, falha de conexão. Tenta de novo.';
      });
  });

  copyBtn.addEventListener('click',function(){
    navigator.clipboard.writeText(link.textContent).then(function(){
      var t=copyBtn.textContent; copyBtn.textContent='Copiado ✓';
      setTimeout(function(){copyBtn.textContent=t;},1600);
    });
  });

  newBtn.addEventListener('click',function(){
    ok.classList.remove('show'); form.style.display='flex'; form.reset();
    form.parcelas.value='12'; form.descricao.focus();
  });
})();
</script>
</body>
</html>
