<html lang="pt-BR">
<head>

<style>
  :root{--bg:#08090f;--bege:#F4F4F6;--muted:#9599b0;--dim:#61647e;--line:rgba(255,255,255,.10);--orange:#FF6701;--orange2:#ff853a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--bege);font-family:'Lato',system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:56px 20px 40px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{text-decoration:none;color:inherit}
  ::selection{background:var(--orange);color:#12070a}

  /* ambient nodes */
  .nodes{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.45}
  .nodes svg{position:absolute;top:-8%;right:-14%;width:80vmax;height:80vmax}
  .grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.5;mix-blend-mode:overlay;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%25" height="100%25" filter="url(%23n)" opacity="0.5"/></svg>')}

  .card{position:relative;z-index:2;width:100%;max-width:440px;text-align:center}

  /* avatar */
  .avatar{
    width:96px;height:96px;border-radius:50%;
    object-fit:cover;object-position:center 15%;
    margin:0 auto 20px;display:block;
    border:2px solid rgba(255,103,1,.5);
    box-shadow:0 0 0 5px rgba(255,103,1,.07),0 12px 32px rgba(0,0,0,.5);
    filter:grayscale(1) contrast(1.05);
  }

  /* name */
  .name{font-family:'Sora';font-weight:800;font-size:1.65rem;letter-spacing:-.02em;display:inline-flex;align-items:center;gap:10px;justify-content:center}
  .name .bars{display:inline-flex;align-items:flex-end;gap:3px;height:19px}
  .name .bars i{width:4px;border-radius:1px;background:var(--orange)}
  .name .bars i:nth-child(1){height:8px;opacity:.5}.name .bars i:nth-child(2){height:13px;opacity:.78}.name .bars i:nth-child(3){height:19px}

  /* handle + tag */
  .handle{font-family:'Space Mono',monospace;font-size:11px;color:var(--orange);margin-top:8px;letter-spacing:.08em;text-transform:uppercase}
  .tag{color:var(--muted);font-size:.96rem;margin:12px auto 30px;max-width:300px;line-height:1.5;font-style:italic}

  /* CTA button — Fale comigo */
  .cta-btn{
    display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;padding:17px 20px;
    background:var(--orange);color:#fff;
    border-radius:14px;border:none;
    font-family:'Sora';font-weight:700;font-size:1.02rem;
    cursor:pointer;margin-bottom:14px;
    transition:transform .18s,filter .18s;
    letter-spacing:.01em;
  }
  .cta-btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
  .cta-btn:active{transform:scale(.97)}
  .cta-btn svg{width:18px;height:18px;flex:none}

  /* regular links */
  .lk{display:flex;align-items:center;gap:16px;width:100%;padding:15px 18px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03);margin-bottom:10px;transition:transform .18s,border-color .2s,background .2s}
  .lk:hover{transform:translateY(-2px);border-color:rgba(255,103,1,.5);background:linear-gradient(100deg,rgba(255,103,1,.09),rgba(255,255,255,.03))}
  .lk .ic{flex:none;width:24px;height:24px;color:var(--bege);display:flex;align-items:center;justify-content:center;transition:color .2s}
  .lk .ic svg{width:22px;height:22px}
  .lk:hover .ic{color:var(--orange)}
  .lk .tx{flex:1;text-align:left;display:flex;flex-direction:column;line-height:1.25}
  .lk .lb{font-family:'Sora';font-weight:600;font-size:1rem}
  .lk .sb{font-family:'Space Mono',monospace;font-size:11px;color:var(--dim)}
  .lk .ar{color:var(--dim);font-size:14px;transition:color .2s,transform .2s}
  .lk:hover .ar{color:var(--orange);transform:translate(2px,-2px)}

  /* footer */
  .foot{margin-top:24px;font-family:'Space Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:.06em}

  /* animations */
  .rv{opacity:0;transform:translateY(14px);animation:in .55s cubic-bezier(.16,1,.3,1) forwards;animation-delay:var(--d,0s)}
  @keyframes in{to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.rv{animation:none;opacity:1;transform:none}}
</style>
</head>

  <a class="cta-btn rv" style="--d:.15s" href="/formulario">
