<style>
  :root{--bg:#08090f;--bege:#F4F4F6;--muted:#9599b0;--dim:#61647e;--line:rgba(255,255,255,.10);--orange:#FF6701;--orange2:#ff853a}

  .lk .tx{flex:1;text-align:left;display:flex;flex-direction:column;line-height:1.25}
  .lk .lb{font-family:'Sora';font-weight:600;font-size:1.02rem}
  .lk .sb{font-family:'Space Mono',monospace;font-size:11px;color:var(--dim)}
  .lk .ar{color:var(--dim);font-size:15px;transition:color .2s,transform .2s}
