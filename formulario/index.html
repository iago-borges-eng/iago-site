<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Falar com Iago Bald</title>
<meta name="description" content="Consultoria, mentoria, curso ou dúvida. Deixa seu contato e eu retorno pessoalmente.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:     #0c0e23;
    --panel:  #13162e;
    --card:   #1a1f42;
    --line:   rgba(255,255,255,.08);
    --orange: #FF6701;
    --bege:   #F4F4F6;
    --muted:  #8a8ea8;
    --dim:    #4a4e68;
  }

  html { background: var(--bg); color: var(--bege); font-family: 'Lato', sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100svh; display: flex; flex-direction: column; }

  /* ── PHOTO HEADER ── */
  .photo-header {
    position: relative;
    height: 50vw;
    max-height: 280px;
    min-height: 160px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .photo-header img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: center 12%;
    filter: brightness(.65);
  }
  .photo-header::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(12,14,35,.1) 0%, rgba(12,14,35,.96) 100%);
  }
  .photo-header-text {
    position: absolute; bottom: 20px; left: 24px; right: 24px; z-index: 1;
  }
  .logo-line { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .logo-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--orange); }
  .logo-name { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 12px; color: var(--bege); letter-spacing: .1em; text-transform: uppercase; }
  .header-headline {
    font-family: 'Sora', sans-serif; font-weight: 800;
    font-size: clamp(1.35rem, 5.5vw, 1.9rem); line-height: 1.15; color: var(--bege);
  }
  .header-headline em { color: var(--orange); font-style: normal; }

  /* ── CARD ── */
  .card {
    flex: 1; background: var(--panel);
    border-radius: 20px 20px 0 0; margin-top: -20px;
    position: relative; z-index: 1;
    padding: 28px 20px 40px;
  }
  .card-sub { font-size: 14px; color: var(--muted); margin-bottom: 24px; line-height: 1.55; }

  /* ── SECTION LABEL ── */
  .sec-label {
    font-family: 'Sora', sans-serif; font-size: 10px; font-weight: 600;
    color: var(--dim); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 10px;
  }

  /* ── PRODUCT CARDS 2×2 ── */
  .product-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; margin-bottom: 24px;
  }
  .product-grid label { cursor: pointer; display: block; }
  .product-grid input[type="radio"] { display: none; }
  .prod-card {
    display: flex; flex-direction: column; align-items: flex-start;
    gap: 6px; padding: 14px 14px 12px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--card);
    transition: border-color .18s, background .18s;
    user-select: none; -webkit-tap-highlight-color: transparent;
    min-height: 80px;
  }
  .prod-card .prod-icon {
    width: 28px; height: 28px; border-radius: 8px;
    background: rgba(255,255,255,.05);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); transition: color .18s, background .18s;
  }
  .prod-card .prod-icon svg { width: 16px; height: 16px; }
  .prod-card .prod-name {
    font-family: 'Sora', sans-serif; font-weight: 600; font-size: 13px;
    color: var(--bege); line-height: 1.2;
  }
  .prod-card .prod-desc {
    font-size: 11px; color: var(--dim); line-height: 1.3;
  }
  /* selected state */
  .product-grid input:checked + .prod-card {
    border-color: var(--orange);
    background: rgba(255, 103, 1, .07);
  }
  .product-grid input:checked + .prod-card .prod-icon {
    background: rgba(255, 103, 1, .15); color: var(--orange);
  }
  .product-grid label:active .prod-card { transform: scale(.97); }

  /* ── FIELDS ── */
  .fields { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 360px) { .field-row { grid-template-columns: 1fr; } }

  input[type="text"], input[type="tel"], input[type="email"], textarea {
    width: 100%;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--line); border-radius: 10px;
    color: var(--bege); font-family: 'Lato', sans-serif; font-size: 15px;
    padding: 13px 14px; outline: none;
    transition: border-color .18s, background .18s;
    -webkit-appearance: none;
  }
  input::placeholder, textarea::placeholder { color: var(--dim); }
  input:focus, textarea:focus {
    border-color: var(--orange); background: rgba(255,103,1,.04);
  }
  textarea { resize: none; min-height: 72px; }
  .hp { position: absolute !important; left: -9999px; width: 1px; height: 1px; opacity: 0; }

  /* required badge */
  .field-req { position: relative; }
  .field-req::after {
    content: '*';
    position: absolute; top: 13px; right: 12px;
    font-size: 14px; color: var(--orange); pointer-events: none;
  }

  /* ── SUBMIT ── */
  .btn-submit {
    display: flex; align-items: center; justify-content: center;
    width: 100%; padding: 16px 20px;
    border-radius: 12px; border: none;
    background: var(--orange); color: #fff;
    font-family: 'Sora', sans-serif; font-weight: 700; font-size: 15px;
    cursor: pointer; transition: filter .18s, transform .14s;
    -webkit-tap-highlight-color: transparent;
    letter-spacing: .01em;
  }
  .btn-submit:hover { filter: brightness(1.1); }
  .btn-submit:active { transform: scale(.97); }
  .btn-submit:disabled { opacity: .5; cursor: not-allowed; }

  /* ── SUCCESS ── */
  .success { display: none; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 12px 0; }
  .success.show { display: flex; }
  .success-icon {
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255,103,1,.1); border: 1.5px solid var(--orange);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .success h2 { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 1.15rem; }
  .success p { font-size: 14px; color: var(--muted); line-height: 1.6; max-width: 26ch; }
  .back-link { font-size: 13px; color: var(--dim); text-decoration: none; margin-top: 4px; }
  .back-link:hover { color: var(--muted); }

  /* ── FOOTER ── */
  .page-footer {
    text-align: center; padding: 18px 20px;
    font-size: 12px; color: var(--dim);
    font-family: 'Sora', sans-serif; letter-spacing: .04em;
  }
  .page-footer a { color: var(--dim); text-decoration: none; }
  .page-footer a:hover { color: var(--muted); }

  /* ── DESKTOP ── */
  @media (min-width: 560px) {
    body { align-items: center; justify-content: center; padding: 40px 20px; }
    .photo-header { border-radius: 16px 16px 0 0; max-height: 240px; }
    .card { border-radius: 0 0 16px 16px; margin-top: 0; padding: 32px 28px 40px; }
    .page-wrap {
      width: 100%; max-width: 440px;
      border-radius: 16px; overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
    }
  }
</style>
</head>
<body>
<div class="page-wrap">

  <div class="photo-header">
    <img src="/assets/iago-contact.jpg" alt="Iago Bald" loading="eager" decoding="async">
    <div class="photo-header-text">
      <div class="logo-line">
        <div class="logo-dot"></div>
        <span class="logo-name">Iago Bald</span>
      </div>
      <h1 class="header-headline">Vamos conversar sobre<br><em>o seu negócio.</em></h1>
    </div>
  </div>

  <div class="card">
    <p class="card-sub">Respondo pessoalmente. Escolha o assunto e deixa seu contato.</p>

    <div id="formWrap">
      <div class="sec-label">O que você precisa?</div>
      <div class="product-grid">

        <label>
          <input type="radio" name="tipo" value="consultoria">
          <div class="prod-card">
            <div class="prod-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
            </div>
            <span class="prod-name">Consultoria</span>
            <span class="prod-desc">Organizar e sistematizar o negócio</span>
          </div>
        </label>

        <label>
          <input type="radio" name="tipo" value="mentoria">
          <div class="prod-card">
            <div class="prod-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3Z"/></svg>
            </div>
            <span class="prod-name">Mentoria</span>
            <span class="prod-desc">Aprender a usar IA na prática</span>
          </div>
        </label>

        <label>
          <input type="radio" name="tipo" value="cursos">
          <div class="prod-card">
            <div class="prod-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 6.5C10.5 5 8 4.5 5 5v13c3-.5 5.5 0 7 1.5M12 6.5C13.5 5 16 4.5 19 5v13c-3-.5-5.5 0-7 1.5"/></svg>
            </div>
            <span class="prod-name">Cursos</span>
            <span class="prod-desc">Aulas e workshops de IA</span>
          </div>
        </label>

        <label>
          <input type="radio" name="tipo" value="duvidas">
          <div class="prod-card">
            <div class="prod-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </div>
            <span class="prod-name">Dúvidas</span>
            <span class="prod-desc">Só uma pergunta ou papo rápido</span>
          </div>
        </label>

      </div>

      <form id="leadForm" novalidate>
        <div class="fields">
          <div class="field-row">
            <div class="field-req">
              <input type="tel" name="telefone" placeholder="WhatsApp *" required autocomplete="tel">
            </div>
            <div class="field-req">
              <input type="email" name="email" placeholder="E-mail *" required autocomplete="email">
            </div>
          </div>
          <input type="text" name="nome" placeholder="Como posso te chamar? (opcional)" autocomplete="name">
          <textarea name="mensagem" rows="3" placeholder="Algo que queira me contar antes? (opcional)"></textarea>
        </div>
        <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit" id="submitBtn" class="btn-submit">Enviar mensagem</button>
      </form>
    </div>

    <div class="success" id="successMsg">
      <div class="success-icon">✓</div>
      <h2>Mensagem recebida!</h2>
      <p>Eu retorno pessoalmente no contato que você deixou.</p>
      <a href="https://iagobald.com.br" class="back-link">← Ver mais sobre o trabalho</a>
    </div>
  </div>

  <footer class="page-footer">
    <a href="https://iagobald.com.br">iagobald.com.br</a>
  </footer>
</div>

<script>
(function(){
  // Pre-select tipo from URL param (?tipo=consultoria etc.)
  var tipoParam = new URLSearchParams(window.location.search).get('tipo');
  if (tipoParam) {
    var radio = document.querySelector('input[name="tipo"][value="' + tipoParam + '"]');
    if (radio) radio.checked = true;
  }

  var SUPA = 'https://rgunvvbtqeugzzxfnvhi.supabase.co';
  var KEY  = 'sb_publishable_-NZo96CyCR32RBLum8mEag_Z9yJ0SKX';

  var form       = document.getElementById('leadForm');
  var submitBtn  = document.getElementById('submitBtn');
  var formWrap   = document.getElementById('formWrap');
  var successMsg = document.getElementById('successMsg');

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    if (form.querySelector('[name="website"]').value) {
      formWrap.hidden = true; successMsg.classList.add('show'); return;
    }

    var telefone = (form.querySelector('[name="telefone"]').value || '').trim();
    var email    = (form.querySelector('[name="email"]').value || '').trim();
    var nome     = (form.querySelector('[name="nome"]').value || '').trim() || null;
    var mensagem = (form.querySelector('[name="mensagem"]').value || '').trim() || null;
    var tipoEl   = document.querySelector('input[name="tipo"]:checked');
    var tipo     = tipoEl ? tipoEl.value : null;

    if (!telefone || !email) {
      if (!telefone) form.querySelector('[name="telefone"]').focus();
      else form.querySelector('[name="email"]').focus();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando…';

    var id = 'form-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);

    fetch(SUPA + '/rest/v1/leads_formulario', {
      method: 'POST',
      headers: {
        apikey: KEY,
        Authorization: 'Bearer ' + KEY,
        'Content-Type': 'application/json',
        Prefer: 'return=minimal'
      },
      body: JSON.stringify({
        id: id,
        tipo: tipo,
        nome: nome,
        telefone: telefone,
        email: email,
        respostas: mensagem ? { mensagem: mensagem } : null
      })
    })
    .then(function(r) {
      if (!r.ok) throw 0;
      formWrap.hidden = true;
      successMsg.classList.add('show');
    })
    .catch(function() {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enviar mensagem';
      alert('Ops, não consegui enviar. Tente novamente em instantes.');
    });
  });
})();
</script>
</body>
</html>
