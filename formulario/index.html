<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Falar com Iago Bald</title>
<meta name="description" content="Diagnóstico, sistema sob medida, agente de WhatsApp ou só uma dúvida. Deixa teu contato.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:     #0c0e23;
    --panel:  #13162e;
    --line:   rgba(255,255,255,.08);
    --orange: #FF6701;
    --bege:   #F4F4F6;
    --muted:  #8a8ea8;
    --dim:    #4a4e68;
    --green:  #25D366;
  }

  html { background: var(--bg); color: var(--bege); font-family: 'Lato', sans-serif; font-size: 16px; -webkit-font-smoothing: antialiased; }
  body { min-height: 100svh; display: flex; flex-direction: column; }

  /* ── PHOTO HEADER ── */
  .photo-header {
    position: relative;
    height: 52vw;
    max-height: 300px;
    min-height: 180px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .photo-header img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 12%;
    filter: brightness(.7);
  }
  .photo-header::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(12,14,35,.2) 0%, rgba(12,14,35,.95) 100%);
  }
  .photo-header-text {
    position: absolute;
    bottom: 20px;
    left: 24px;
    right: 24px;
    z-index: 1;
  }
  .logo-line {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); flex-shrink: 0; }
  .logo-name { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 13px; color: var(--bege); letter-spacing: .06em; text-transform: uppercase; }
  .header-headline {
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: clamp(1.4rem, 6vw, 2rem);
    line-height: 1.15;
    color: var(--bege);
  }
  .header-headline em { color: var(--orange); font-style: normal; }

  /* ── FORM CARD ── */
  .card {
    flex: 1;
    background: var(--panel);
    border-radius: 20px 20px 0 0;
    margin-top: -20px;
    position: relative;
    z-index: 1;
    padding: 28px 20px 32px;
  }

  @media (min-width: 480px) {
    .card { padding: 32px 28px 40px; }
  }

  .card-sub {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 24px;
    line-height: 1.55;
  }

  /* ── TOPICS ── */
  .topics-label {
    font-family: 'Sora', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: .1em;
    margin-bottom: 12px;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }
  .chips label { cursor: pointer; }
  .chips input[type="checkbox"] { display: none; }
  .chips span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 15px;
    border: 1px solid var(--line);
    border-radius: 100px;
    font-size: 14px;
    color: var(--muted);
    background: rgba(255,255,255,.03);
    transition: border-color .16s, color .16s, background .16s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .chips input:checked + span {
    border-color: var(--orange);
    color: var(--orange);
    background: rgba(255, 103, 1, .1);
  }
  .chips label:active span {
    transform: scale(.96);
  }
  .chip-icon { font-size: 15px; line-height: 1; }

  /* ── FORM FIELDS ── */
  form { display: flex; flex-direction: column; gap: 12px; }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  @media (max-width: 380px) { .field-row { grid-template-columns: 1fr; } }

  input[type="text"],
  input[type="email"],
  input[type="tel"],
  textarea {
    width: 100%;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--bege);
    font-family: 'Lato', sans-serif;
    font-size: 15px;
    padding: 13px 15px;
    outline: none;
    transition: border-color .18s, background .18s;
    -webkit-appearance: none;
  }
  input[type="text"]::placeholder,
  input[type="email"]::placeholder,
  input[type="tel"]::placeholder,
  textarea::placeholder { color: var(--dim); }
  input:focus, textarea:focus {
    border-color: var(--orange);
    background: rgba(255, 103, 1, .04);
  }
  textarea { resize: none; min-height: 80px; }

  .hp { position: absolute !important; left: -9999px; width: 1px; height: 1px; opacity: 0; }

  /* ── BUTTONS ── */
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 15px 20px;
    border-radius: 12px;
    border: none;
    font-family: 'Sora', sans-serif;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    text-decoration: none;
    transition: transform .16s, filter .16s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--orange); color: #fff; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-wa { background: var(--green); color: #fff; }
  .btn-wa:hover { filter: brightness(1.05); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ── DIVIDER ── */
  .or-line {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--dim);
    font-size: 12px;
    font-family: 'Sora', sans-serif;
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .or-line::before, .or-line::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  /* ── SUCCESS ── */
  .success {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 16px;
    padding: 16px 0;
  }
  .success.show { display: flex; }
  .success-icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(255,103,1,.12);
    border: 1.5px solid var(--orange);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  .success h2 { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 1.2rem; }
  .success p { font-size: 14px; color: var(--muted); line-height: 1.6; max-width: 28ch; }
  .back-link {
    font-size: 13px;
    color: var(--dim);
    text-decoration: none;
    margin-top: 8px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .back-link:hover { color: var(--muted); }

  /* ── FOOTER ── */
  .page-footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: var(--dim);
    font-family: 'Sora', sans-serif;
  }
  .page-footer a { color: var(--dim); text-decoration: none; }
  .page-footer a:hover { color: var(--muted); }

  /* ── DESKTOP ── */
  @media (min-width: 600px) {
    body { align-items: center; justify-content: center; padding: 40px 20px; }
    .photo-header {
      border-radius: 16px 16px 0 0;
      min-height: 220px;
      max-height: 260px;
    }
    .card {
      border-radius: 0 0 16px 16px;
      margin-top: 0;
    }
    .page-wrap {
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,.5);
    }
  }
</style>
</head>
<body>

<div class="page-wrap">
  <!-- Photo header -->
  <div class="photo-header">
    <img src="/assets/iago-contact.jpg" alt="Iago Bald" loading="eager" decoding="async">
    <div class="photo-header-text">
      <div class="logo-line">
        <div class="logo-dot"></div>
        <span class="logo-name">Iago Bald</span>
      </div>
      <h1 class="header-headline">Vamos conversar sobre<br><em>o seu negócio.</em></h1>
    </div>
  </div>

  <!-- Form card -->
  <div class="card">
    <p class="card-sub">Diagnóstico, sistema, agente de IA ou só uma dúvida. Respondo pessoalmente.</p>

    <!-- Form -->
    <div id="formWrap">
      <div class="topics-label">Sobre o que você quer falar?</div>
      <div class="chips">
        <label><input type="checkbox" name="topico" value="diagnostico"><span><span class="chip-icon">🔍</span> Diagnóstico</span></label>
        <label><input type="checkbox" name="topico" value="sistema"><span><span class="chip-icon">🛠</span> Sistema sob medida</span></label>
        <label><input type="checkbox" name="topico" value="agente"><span><span class="chip-icon">💬</span> Agente WhatsApp</span></label>
        <label><input type="checkbox" name="topico" value="aula"><span><span class="chip-icon">🎓</span> Aula ou workshop</span></label>
        <label><input type="checkbox" name="topico" value="duvida"><span><span class="chip-icon">💡</span> Só uma dúvida</span></label>
      </div>

      <form id="leadForm" novalidate>
        <div class="field-row">
          <input type="text" name="nome" placeholder="Seu nome" required autocomplete="name">
          <input type="text" name="contato" placeholder="WhatsApp ou e-mail" required autocomplete="tel">
        </div>
        <textarea name="motivo" rows="3" placeholder="Algo que queira me contar antes da conversa? (opcional)"></textarea>
        <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

        <div class="actions">
          <button type="submit" id="submitBtn" class="btn btn-primary">Enviar mensagem</button>
          <div class="or-line">ou</div>
          <a class="btn btn-wa" id="waBtn" href="https://wa.me/5571999960809?text=Oi%20Iago%2C%20vim%20pelo%20seu%20site" target="_blank" rel="noopener">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.15-1.8-.9-2.1-1-.28-.1-.48-.15-.68.15s-.78 1-.96 1.2c-.18.2-.35.22-.65.07-.3-.15-1.27-.47-2.42-1.5-.9-.8-1.5-1.78-1.67-2.08-.17-.3-.02-.46.13-.6.13-.14.3-.35.44-.53.15-.18.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.68-1.63-.93-2.23-.24-.58-.5-.5-.68-.5l-.58-.01c-.2 0-.53.07-.8.37s-1.05 1.02-1.05 2.5 1.08 2.9 1.23 3.1c.15.2 2.12 3.24 5.14 4.54.72.3 1.28.5 1.72.64.72.23 1.38.2 1.9.12.58-.09 1.8-.74 2.05-1.44.25-.7.25-1.3.18-1.44-.07-.13-.27-.2-.57-.35zM12 2a10 10 0 0 0-8.6 15.06L2 22l5.06-1.33A10 10 0 1 0 12 2z"/></svg>
            Chamar no WhatsApp
          </a>
        </div>
      </form>
    </div>

    <!-- Success state -->
    <div class="success" id="successMsg">
      <div class="success-icon">✓</div>
      <h2>Mensagem recebida!</h2>
      <p>Eu retorno pessoalmente no contato que você deixou.</p>
      <a href="https://iagobald.com.br" class="back-link">← Ver mais sobre o trabalho</a>
    </div>
  </div>

  <footer class="page-footer">
    <a href="https://iagobald.com.br">iagobald.com.br</a>
  </footer>
</div>

<script>
(function(){
  var SUPA = 'https://rgunvvbtqeugzzxfnvhi.supabase.co';
  var KEY  = 'sb_publishable_-NZo96CyCR32RBLum8mEag_Z9yJ0SKX';

  var form      = document.getElementById('leadForm');
  var submitBtn = document.getElementById('submitBtn');
  var waBtn     = document.getElementById('waBtn');
  var formWrap  = document.getElementById('formWrap');
  var successMsg = document.getElementById('successMsg');

  // Update WhatsApp link with selected topics
  function updateWaLink() {
    var topics = Array.from(document.querySelectorAll('input[name="topico"]:checked'))
      .map(function(el){ return el.value; });
    var msg = 'Oi Iago, vim pelo seu site';
    if (topics.length) msg += '. Quero falar sobre: ' + topics.join(', ');
    waBtn.href = 'https://wa.me/5571999960809?text=' + encodeURIComponent(msg);
  }

  document.querySelectorAll('input[name="topico"]').forEach(function(el){
    el.addEventListener('change', updateWaLink);
  });

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    // Honeypot
    if (form.querySelector('[name="website"]').value) {
      formWrap.hidden = true;
      successMsg.classList.add('show');
      return;
    }

    var nome    = (form.querySelector('[name="nome"]').value || '').trim();
    var contato = (form.querySelector('[name="contato"]').value || '').trim();
    var motivo  = (form.querySelector('[name="motivo"]').value || '').trim() || null;
    var topicos = Array.from(document.querySelectorAll('input[name="topico"]:checked'))
      .map(function(el){ return el.value; }).join(', ') || null;

    if (!nome || !contato) {
      form.querySelector('[name="nome"]').focus();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando…';

    var id = 'form-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);

    fetch(SUPA + '/rest/v1/leads_site', {
      method: 'POST',
      headers: {
        apikey: KEY,
        Authorization: 'Bearer ' + KEY,
        'Content-Type': 'application/json',
        Prefer: 'return=minimal'
      },
      body: JSON.stringify({ id: id, nome: nome, contato: contato, motivo: motivo, topicos: topicos, origem: 'formulario' })
    })
    .then(function(r) {
      if (!r.ok) throw 0;
      formWrap.hidden = true;
      successMsg.classList.add('show');
    })
    .catch(function() {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enviar mensagem';
      alert('Ops, não consegui enviar agora. Me chama no WhatsApp que resolve na hora.');
    });
  });
})();
</script>
</body>
</html>
